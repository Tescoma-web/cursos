<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cierre Tescoma</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100vw; height: 100vh; overflow: hidden; font-family: 'Poppins', sans-serif; background: #111; }

/* ── FONDO idéntico al slide de cierre ── */
.bg { position: absolute; inset: 0; }
.bg-gradient {
position: absolute; inset: 0;
background:
radial-gradient(ellipse 55% 90% at 72% 50%, rgba(200,0,0,0.82) 0%, transparent 70%),
radial-gradient(ellipse 30% 60% at 10% 50%, rgba(120,0,0,0.22) 0%, transparent 70%);
}
.bg-lines {
position: absolute; inset: 0;
background-image: repeating-linear-gradient(-30deg, transparent, transparent 8.2vw, rgba(55,0,0,0.55) 8.2vw, rgba(55,0,0,0.55) 8.3vw);
}

/* ── FRANJA BLANCA INFERIOR ── */
.footer-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 8.3vh; background: #fff; }

/* ── LOGO TESCOMA centrado (bloque rojo) ── */
.logo-wrap {
position: absolute;
top: 0; left: 0; right: 0; bottom: 8.3vh;
display: flex; flex-direction: column;
align-items: center; justify-content: center;
gap: 2.8vh;
}

.logo-img {
width: 62vw;
max-width: 900px;
height: auto;
opacity: 0;
transform: scale(0.93);
animation: logoIn 0.6s 0.2s cubic-bezier(.2,0,.2,1) forwards;
border-radius: .6vw;
}
@keyframes logoIn { to { opacity: 1; transform: scale(1); } }

/* ── SUBTÍTULO “Portal Profesional B2B · Tescoma España” ── */
.portal-sub {
font-size: 2.2vw;
font-weight: 800;
color: rgba(175,175,175,0.85);
letter-spacing: .02em;
opacity: 0;
animation: fadeIn 0.5s 0.75s ease forwards;
}
@keyframes fadeIn { to { opacity: 1; } }

/* ── CLAIM — letras de t=2 a t=4 ── */
.claim-wrap {
display: flex;
align-items: center;
gap: 0;
justify-content: center;
}

.claim-char {
display: inline-block;
font-size: 3.7vw;
font-weight: 800;
font-style: italic;
color: rgba(175,175,175,0.85);
opacity: 0;
transform: translateY(1vh);
animation: charIn 0.15s ease forwards;
white-space: pre; letter-spacing: .06em;
}
@keyframes charIn { to { opacity: 1; transform: translateY(0); } }

.claim-divider { width: 6vw; height: .35vh; background: rgba(255,255,255,0.4); border-radius: 2px; opacity: 0; animation: fadeIn 0.4s 1.8s ease forwards; }
/* ── BOTÓN ── */
.restart {
position: fixed; bottom: 1.5vh; left: 50%;
transform: translateX(-50%);
background: rgba(0,0,0,0.65); color: rgba(175,175,175,0.85);
border: 1px solid rgba(255,255,255,0.3);
font-family: ‘Poppins’, sans-serif; font-size: .8vw; font-weight: 600;
padding: .6vh 1.5vw; border-radius: 2vw; cursor: pointer;
z-index: 999; transition: background .2s;
}
.restart:hover { background: rgba(204,0,0,0.85); }
</style>

</head>

<button class="restart" onclick="replay()">↺ Repetir</button>

<script>
const TEXT = "INNOVANDO PARA HACER CRECER TU NEGOCIO";

// Las letras salen de t=2s a t=4s → 2000ms de spread para 40 chars
const START_MS  = 2000;
const END_MS    = 4000;
const SPREAD_MS = END_MS - START_MS;

function buildClaim() {
  const wrap = document.getElementById('claim');
  wrap.innerHTML = '';
  const chars = TEXT.split('');
  const step = SPREAD_MS / (chars.length - 1);
  chars.forEach((ch, i) => {
    const s = document.createElement('span');
    s.className = 'claim-char';
    s.textContent = ch;
    s.style.animationDelay = ((START_MS + i * step) / 1000) + 's';
    wrap.appendChild(s);
  });
}

function replay() {
  document.querySelectorAll('.logo-box, .portal-sub, .claim-char').forEach(el => {
    el.style.animation = 'none'; void el.offsetHeight; el.style.animation = '';
  });
  buildClaim();
}

buildClaim();
</script>
